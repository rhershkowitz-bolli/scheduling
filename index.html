<style>

:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161c; --panel:#1a2029; --fg:#e7ebf0; --muted:#9aa5b1; --line:#2f3946; --head:#2b3d58; --headfg:#fff; --slot:#222a35; --blocked:#262d37;
  --LIT:#6ea8ec; --ART:#f08a52; --MUS:#b08cff; --HG:#e0b341; --SCI:#3fc1b3; --SOC:#f06aa8; --FILM:#a3b1c2; --WRI:#5cc97c; --DRA:#f07171; --CE:#4cc3dc; --Philo:#8f93ff; --REL:#c9a27e;
  --tint:20%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1a2029; --fg:#e7ebf0; --muted:#9aa5b1; --line:#2f3946; --head:#2b3d58; --headfg:#fff; --slot:#222a35; --blocked:#262d37;

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px}
.wrap{padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-size:26px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px}
.tabs button{font:700 14px var(--body);padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--head);color:var(--headfg);border-color:var(--head)}
.tabs button:focus-visible,.legend button:focus-visible{outline:2px solid var(--LIT);outline-offset:2px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.legend .lab{font-weight:700;margin-right:4px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.legend button{display:inline-flex;align-items:center;gap:6px;font:13px var(--body);padding:4px 10px 4px 6px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.legend button[aria-pressed="true"]{border-color:var(--fg);font-weight:700}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:1px 6px;border-radius:5px;font:700 11px var(--display);letter-spacing:.03em;color:#fff;background:var(--c)}
:root[data-theme="dark"] .chip{color:#10141a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip{color:#10141a}}
.lenkey{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.len{display:inline-block;font:700 11px var(--display);padding:1px 6px;border-radius:4px;white-space:nowrap}
.len.l10{background:var(--fg);color:var(--bg)}
.len.l5a,.len.l5b,.len.lTBD{border:1.5px solid var(--fg);color:var(--fg)}
.len.l5b{border-style:dashed}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:1000px}
th{background:var(--head);color:var(--headfg);font:700 14px var(--display);padding:10px;text-align:left;position:sticky;top:0}
th.slot{width:110px}
td{border-top:1px solid var(--line);border-left:1px solid var(--line);vertical-align:top;padding:6px}
td.slot{background:var(--slot);font:700 14px var(--display);white-space:nowrap}
td.slot small{display:block;font:400 12px var(--body);color:var(--muted);margin-top:2px}
tr.blocked td:not(.slot){background:var(--blocked);color:var(--muted)}
.room{display:grid;grid-template-rows:1fr 1fr;gap:4px;min-height:96px}
.room .ten{grid-row:1 / span 2}
.zoom{display:flex;flex-direction:column;gap:4px}
.card{--c:var(--muted);border-radius:6px;padding:6px 8px;background:color-mix(in srgb,var(--c) var(--tint),var(--panel));border-left:5px solid var(--c);display:flex;flex-direction:column;gap:3px;min-width:0}
.card .top{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.card .t{font-weight:700;line-height:1.25}
.card .s{color:var(--muted);font-size:12.5px}
.card .ph{font-size:11.5px;color:var(--DRA);font-weight:700}
.card.ten{justify-content:center}
.open{border:1.5px dashed var(--line);border-radius:6px;color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center}
.dim{opacity:.18}
.count{font:400 12px var(--body);color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{transition:opacity .15s}}
</style>
</head>

const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function card(r,cls=''){
  const c=r.c[0]; const lenTxt=r.h==='10'?'10 wk':r.h;
  const chips=r.c.map(x=>`<span class="chip" style="--c:${cv(x)}" title="${esc(SUBJ[x]||x)}">${esc(x)}</span>`).join('');
  return `<div class="card ${cls}" style="--c:${cv(c)}" data-c="${esc(r.c.join(' '))}" title="${esc(r.full||r.t)}">
    <div class="top"><span class="len l${r.h}">${lenTxt}</span>${chips}</div>
    <div class="t">${esc(r.t)}</div>${r.s?`<div class="s">${esc(r.s)}${r.note?' · '+esc(r.note):''}</div>`:''}${(r.ph&&r.s!=='')?'<div class="ph">Placeholder: availability not yet known</div>':''}</div>`;
}
function roomCell(rs){
  if(!rs.length) return '';
  const ten=rs.find(r=>r.h==='10');
  if(ten) return `<div class="room">${card(ten,'ten')}</div>`;
  const a=rs.find(r=>r.h==='5a'), b=rs.find(r=>r.h==='5b');
  return `<div class="room">${a?card(a):'<div class="open">5a open</div>'}${b?card(b):'<div class="open">5b open</div>'}</div>`;
}
const ord={'10':0,'5a':1,'5b':2,'TBD':3};
function render(){
  const res=DATA[ver];
  document.getElementById('note').textContent=NOTES[ver];
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===ver));
  let h='<thead><tr><th class="slot">Period</th><th>Room 1</th><th>Room 2</th><th>Room 3 (small)</th><th>Zoom</th></tr></thead><tbody>';
  const days=[['Mon','Monday'],['Tue','Tuesday'],['Wed','Wednesday'],['Thu','Thursday']];
  for(const [d,dn] of days) for(const p of [1,2,3]){

    h+=`<tr><td class="slot">${dn} P${p}<small>${na} courses wks 1–5</small><small>${nb} courses wks 6–10</small></td>`;
    for(const rm of [1,2,3]) h+=`<td>${roomCell(rs.filter(r=>r.rm===rm))}</td>`;
    const z=rs.filter(r=>r.rm===0).sort((x,y)=>ord[x.h]-ord[y.h]);

  }

  h+='</tbody>';
  document.getElementById('grid').innerHTML=h;
  applyFilter();
}
function applyFilter(){
  document.querySelectorAll('.card').forEach(el=>el.classList.toggle('dim',!!filt&&!el.dataset.c.split(' ').includes(filt)));
  document.querySelectorAll('.legend button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===filt));
}
const lg=document.getElementById('legend');
for(const [k,v] of Object.entries(SUBJ)){
  const b=document.createElement('button'); b.type='button'; b.dataset.c=k; b.setAttribute('aria-pressed','false');
  b.innerHTML=`<span class="chip" style="--c:${cv(k)}">${k}</span>${v}`;
  b.onclick=()=>{filt=filt===k?null:k;applyFilter();};
  lg.appendChild(b);
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ver=b.dataset.v; try{history.replaceState(null,'','#'+ver)}catch(e){location.hash=ver} render();});
